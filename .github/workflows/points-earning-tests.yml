name: Development Points System Validation

# Keep the Points work isolated from main and deployment.
on:
  push:
    branches:
      - feature/points-earning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the development branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check Points administration and integrations syntax
        run: |
          node --check commands/points-admin.js
          node --check services/points-audit.js
          node --check services/bounded-work.js
          node --check scripts/points-ledger-health.js
          node --check services/points-rewards.js
          node --check services/participation-observer.js
          node --check commands/points-observe.js
          node --check services/points-backfill.js
          node --check scripts/backfill-points-milestones.js
          node --check commands/shop.js
          node --check commands/profile.js
          node --check index.js
          node --check register-commands.js
      - name: Run automated tests
        run: npm test
