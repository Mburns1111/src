name: Development Shop Validation

# This workflow only runs against the shop/editor development branch.
# It does not deploy, start the bot, or connect to production services.
on:
  push:
    branches:
      - feature/profile-appearance-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the development branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check shop and sticker editor syntax
        run: |
          node --check commands/shop.js
          node --check commands/profile.js
      - name: Run automated tests
        run: npm test
