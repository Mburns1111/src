# One-time cleanup after verifying the completed feature PRs are in main.
# The older activity-giveaways experiment has independent commits, so its
# original tip is kept in an archival tag before deleting its branch.
name: One-time obsolete development branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  consolidate:
    if: github.repository == 'Mburns1111/src'
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact branch heads, preserve the old draft and remove obsolete refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_branch_sha() {
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$1" --jq '.object.sha'
          }

          older_activity='829f11d75388bc77e256ef1c20cf1c8bf7ed2f52'
          integrated_activity='fa79dc9663bf02a82e6868adfbb69b0cc5ea9a3b'
          merged_hatchem='65ae5fd199098ffbe65806f3f6a8b8b4a23f321b'

          # Validate all three heads BEFORE any destructive operation.
          [[ "$(current_branch_sha 'feature/activity-giveaways')" == "$older_activity" ]] || { echo "::error::Old activity branch changed; not deleting"; exit 1; }
          [[ "$(current_branch_sha 'feature/activity-giveaway-opt-in-role')" == "$integrated_activity" ]] || { echo "::error::Integrated giveaway branch changed; not deleting"; exit 1; }
          [[ "$(current_branch_sha 'release/hatchem-prep-2026-11-04')" == "$merged_hatchem" ]] || { echo "::error::Hatchem release branch changed; not deleting"; exit 1; }

          tag='archive/old-activity-giveaways-2026-11-12'
          # GH CLI may print "null" to stdout for a 404 even when it exits nonzero.
          tag_current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"
          [[ "$tag_current" != "null" ]] || tag_current=''
          if [[ -n "$tag_current" ]]; then
            [[ "$tag_current" == "$older_activity" ]] || { echo "::error::Archive tag exists but points elsewhere"; exit 1; }
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="$older_activity" >/dev/null
          fi
          echo "Preserved old activity draft as refs/tags/${tag}"

          for branch in \
            'feature/activity-giveaways' \
            'feature/activity-giveaway-opt-in-role' \
            'release/hatchem-prep-2026-11-04'
          do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted obsolete branch: ${branch}"
          done
